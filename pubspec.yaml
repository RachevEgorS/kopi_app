name: kopi_finance_app
description: Спокойный финансовый дневник «Копи».
publish_to: none
version: 0.4.1+5
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: PTSerif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
        - asset: assets/fonts/PTSerif-Italic.ttf
          style: italic
